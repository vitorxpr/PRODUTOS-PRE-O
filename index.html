<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Rápida de Preços</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-start p-6">

    <div class="w-full max-w-4xl bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
        <header class="mb-6 text-center">
            <h1 class="text-2xl font-bold text-emerald-400">🔍 Consulta Rápida de Preços</h1>
            <p class="text-sm text-slate-400 mt-1">Digite qualquer parte do nome, código ou aroma para buscar.</p>
        </header>

        <!-- Upload -->
        <div id="upload-section" class="mb-6 p-6 border-2 border-dashed border-slate-600 rounded-lg text-center bg-slate-900/50">
            <label class="cursor-pointer flex flex-col items-center justify-center">
                <svg class="w-12 h-12 text-emerald-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
                <span class="text-base font-medium text-slate-200">Clique aqui para selecionar sua planilha (.xls / .xlsx)</span>
                <span class="text-xs text-slate-400 mt-1">Carrega todos os produtos da base de dados</span>
                <input type="file" id="fileInput" accept=".xls, .xlsx, .csv" class="hidden">
            </label>
        </div>

        <!-- Busca com Autocomplete -->
        <div id="search-section" class="hidden space-y-4">
            <div class="relative">
                <div class="flex gap-4 items-center justify-between">
                    <div class="w-full relative">
                        <input type="text" id="searchInput" placeholder="Digite o produto ou aroma (ex: baunilha, yopro, morango)..." autocomplete="off"
                            class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-lg">
                        
                        <!-- Caixa de Sugestões (Autocomplete Dropdown) -->
                        <div id="suggestionsBox" class="absolute left-0 right-0 mt-1 bg-slate-900 border border-slate-700 rounded-lg shadow-2xl max-h-60 overflow-y-auto z-50 hidden divide-y divide-slate-800">
                        </div>
                    </div>
                    <div id="stats" class="text-sm text-slate-400 whitespace-nowrap">
                        Produtos: <span id="totalCount" class="font-bold text-emerald-400">0</span>
                    </div>
                </div>
            </div>

            <!-- Tabela de Resultados Fixos -->
            <div class="overflow-x-auto rounded-lg border border-slate-700 max-h-[450px]">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-900 text-slate-300 sticky top-0">
                        <tr>
                            <th class="p-3 border-b border-slate-700">Produto / Sabor</th>
                            <th class="p-3 border-b border-slate-700 text-right">Preço de Venda</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTable" class="divide-y divide-slate-700 text-sm">
                        <tr>
                            <td colspan="2" class="p-6 text-center text-slate-500">Digite ao menos 2 letras ou escolha na sugestão para ver o preço...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let productData = [];

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                let parsedProducts = [];
                
                for (let i = 0; i < rows.length; i++) {
                    let row = rows[i];
                    if (!row || row.length === 0) continue;

                    let col0 = row[0] !== undefined && row[0] !== null ? String(row[0]).trim() : "";
                    
                    if (col0 && !col0.toUpperCase().includes("PRODUTO") && !col0.toUpperCase().includes("PREÇO")) {
                        let precoVenda = 0.0;
                        if (i + 1 < rows.length) {
                            let nextRow = rows[i + 1];
                            if (nextRow && nextRow.length > 1 && nextRow[1] !== undefined && nextRow[1] !== null) {
                                let val = Number(nextRow[1]);
                                if (!isNaN(val)) {
                                    precoVenda = val;
                                }
                            }
                        }

                        // Adiciona todos os produtos encontrados na estrutura
                        parsedProducts.push({
                            nome: col0,
                            preco: precoVenda
                        });
                    }
                }

                productData = parsedProducts;
                document.getElementById('totalCount').innerText = productData.length;
                document.getElementById('upload-section').classList.add('hidden');
                document.getElementById('search-section').classList.remove('hidden');
            };
            reader.readAsArrayBuffer(file);
        });

        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestionsBox');
        const resultsTable = document.getElementById('resultsTable');

        function renderTable(items) {
            if (items.length === 0) {
                resultsTable.innerHTML = `<tr><td colspan="2" class="p-6 text-center text-slate-500">Nenhum produto encontrado.</td></tr>`;
                return;
            }

            let html = '';
            items.forEach(item => {
                const formattedPrice = item.preco > 0 ? `R$ ${item.preco.toFixed(2).replace('.', ',')}` : 'Sob Consulta';
                html += `
                    <tr class="hover:bg-slate-700/50 transition-colors">
                        <td class="p-3 font-medium text-slate-200">${item.nome}</td>
                        <td class="p-3 text-right font-bold text-emerald-400">${formattedPrice}</td>
                    </tr>
                `;
            });
            resultsTable.innerHTML = html;
        }

        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            if (query.length < 2) {
                suggestionsBox.classList.add('hidden');
                resultsTable.innerHTML = `<tr><td colspan="2" class="p-6 text-center text-slate-500">Digite pelo menos 2 letras...</td></tr>`;
                return;
            }

            const filtered = productData.filter(item => item.nome.toLowerCase().includes(query));

            if (filtered.length > 0) {
                let suggestionsHtml = '';
                filtered.slice(0, 8).forEach(item => {
                    const formattedPrice = item.preco > 0 ? `R$ ${item.preco.toFixed(2).replace('.', ',')}` : 'Sob Consulta';
                    suggestionsHtml += `
                        <div class="p-3 hover:bg-slate-800 cursor-pointer flex justify-between items-center transition-colors" onclick="selectProduct('${item.nome.replace(/'/g, "\\'")}')">
                            <span class="text-slate-200 text-sm font-medium">${item.nome}</span>
                            <span class="text-emerald-400 text-sm font-bold">${formattedPrice}</span>
                        </div>
                    `;
                });
                suggestionsBox.innerHTML = suggestionsHtml;
                suggestionsBox.classList.remove('hidden');
            } else {
                suggestionsBox.classList.add('hidden');
            }

            renderTable(filtered.slice(0, 50));
        });

        window.selectProduct = function(productName) {
            searchInput.value = productName;
            suggestionsBox.classList.add('hidden');
            const found = productData.filter(item => item.nome === productName);
            renderTable(found);
        }

        document.addEventListener('click', function(e) {
            if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
                suggestionsBox.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
